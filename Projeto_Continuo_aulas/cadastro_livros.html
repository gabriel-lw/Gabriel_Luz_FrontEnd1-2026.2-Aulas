                    <section class="informacoes">
                        <h2>Informações</h2>

                        <div id="campos-box">
                            <div class="campo">
                                <label for="nomeLivro">Nome do livro:</label>
                                <input type="text" name="nomeLivro" id="nomeLivro"
                                    placeholder="Digite o nome do livro">
                            </div>

                            <div class="campo">
                                <label for="nomeAutor">Nome do autor:</label>
                                <input type="text" name="nomeAutor" id="nomeAutor"
                                    placeholder="Digite o nome do autor">
                            </div>

                            <div class="campo">
                                <label for="Isbn">ISBN:</label>
                                <input type="number" name="Isbn" id="isbn"
                                    placeholder="Digite o ISBN">
                            </div>

                            <div class="campo">
                                <label for="genero">Gênero principal:</label>
                                <select name="genero" id="genero">
                                    <option value="não-especificado" selected>Não especificado</option>
                                    <option value="romance">Romance</option>
                                    <option value="investigação">Investigação</option>
                                    <option value="terror">Terror</option>
                                    <option value="comédia">Comédia</option>
                                    <option value="ficção-científica">Ficção científica</option>
                                    <option value="outro">Outro</option>
                                </select>
                            </div>

                            <div class="campo">
                                <label for="paginas">Número de páginas:</label>
                                <input type="number" name="paginas" id="paginas" min="1" step="1">
                            </div>

                            <div class="campo">
                                <label for="data">Término da leitura:</label>
                                <input type="date" name="data" id="data">
                            </div>
                        </div>
                    </section>

                    <section class="avaliacao">
                        <h2>Avaliação</h2>

                        <fieldset class="nota">
                            <legend>Como você avalia o livro?</legend>

                            <div class="opcoes">
                            <label for="pessimo">
                                <input type="radio" name="notaEscala" value="Péssimo" id="péssimo">
                                Péssimo
                            </label>

                            <label for="ruim">
                                <input type="radio" name="notaEscala" value="Ruim" id="ruim">
                                Ruim
                            </label>

                            <label for="mediocre">
                                <input type="radio" name="notaEscala" value="Medíocre" id="medíocre">
                                Medíocre
                            </label>

                            <label for="bom">
                                <input type="radio" name="notaEscala" value="Bom" id="bom">
                                Bom
                            </label>

                            <label for="muito-bom">
                                <input type="radio" name="notaEscala" value="Ótimo" id="ótimo">
                                Ótimo
                            </label>

                            <label for="incrivel">
                                <input type="radio" name="notaEscala" value="Incrível" id="incrível">
                                Incrível
                            </label>
                            </div>
                        </fieldset>

                        <div class="comentarios">
                            <label for="comentarios">Comentários</label>
                            <textarea
                            id="comentarios"
                            name="comentariosText"
                            placeholder="Conte o que você achou do livro..."
                            rows="6"
                            minlength="1"
                            maxlength="2000"
                            ></textarea>
                        </div>
                        </section>
